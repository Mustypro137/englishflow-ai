name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Throwaway database for this CI run only. It never touches the real Neon database.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: englishflow
          POSTGRES_PASSWORD: englishflow
          POSTGRES_DB: englishflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U englishflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://englishflow:englishflow@localhost:5432/englishflow
      DIRECT_URL: postgresql://englishflow:englishflow@localhost:5432/englishflow
      TEST_DATABASE_URL: postgresql://englishflow:englishflow@localhost:5432/englishflow
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3100
      # Canary only: AI_PROVIDER is unset, so the app runs without AI (and shows the setup
      # message), while the bundle check proves this value never reaches the browser.
      ANTHROPIC_API_KEY: sk-ant-ci-canary-not-a-real-key-0000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Use the same npm version as local development, so the lock file is read identically.
      - run: npm install -g npm@11.6.1

      - run: npm ci

      # Runtime dependencies only: the dev toolchain has an unpatched advisory (see README, known limitations).
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Load curriculum content
        run: npm run db:seed

      - name: Integration tests
        run: npm run test:integration

      - run: npm run build

      - name: Check that no AI secret reaches the browser
        run: npm run check:bundle

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
